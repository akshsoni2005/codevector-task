<!DOCTYPE html>
<html>
<head>
    <title>Products</title>

    <style>
        body{
            font-family: Arial;
            margin:40px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
        }

        th{
            background:#f5f5f5;
        }

        .top-bar{
            margin-bottom:20px;
        }

        .btn{
            padding:8px 15px;
            background:blue;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

        .btn:hover{
            opacity:0.8;
        }
    </style>

</head>
<body>

<h1>Product Browser</h1>

<div class="top-bar">

<form method="GET">

    <input
        type="text"
        name="category"
        placeholder="Category"
        value="{{ request.GET.category }}"
    >

    <button type="submit">
        Filter
    </button>

</form>

</div>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Category</th>
    <th>Price</th>
</tr>

{% for product in products %}

<tr>
    <td>{{ product.id }}</td>
    <td>{{ product.name }}</td>
    <td>{{ product.category }}</td>
    <td>₹{{ product.price }}</td>
</tr>

{% endfor %}

</table>

<br>

{% if products.has_previous %}
<a class="btn" href="?page={{ products.previous_page_number }}">
    Previous
</a>
{% endif %}

{% if products.has_next %}
<a class="btn" href="?page={{ products.next_page_number }}">
    Next
</a>
{% endif %}

</body>
</html>
